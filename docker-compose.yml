version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobboard
      POSTGRES_PASSWORD: jobboard
      POSTGRES_DB: jobboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobboard"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://jobboard:jobboard@postgres:5432/jobboard?sslmode=disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_in_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_prod}
      PORT: "8081"
      FRONTEND_ORIGIN: http://localhost:5173
      ENV: development
    depends_on:
      postgres:
        condition: service_healthy

  jobs-service:
    build: ./jobs-service
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://jobboard:jobboard@postgres:5432/jobboard?sslmode=disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_in_prod}
      PORT: "8082"
      FRONTEND_ORIGIN: http://localhost:5173
      ENV: development
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      AUTH_SERVICE_URL: http://auth-service:8081
      JOBS_SERVICE_URL: http://jobs-service:8082
      FRONTEND_ORIGIN: http://localhost:5173
    depends_on:
      - auth-service
      - jobs-service

volumes:
  pgdata:
